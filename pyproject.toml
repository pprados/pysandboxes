[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysandboxes"
version = "0.0.0"  # Set with git tag
description = "Lite sandbox for python code execution"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Philippe PRADOS", email = "github@prados.fr" }]
license = "Apache-2.0"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Every entry below is imported by pysandboxes/. A sandbox argues about
# reducing the attack surface, so it has no business installing what it never
# imports: the commented lines record what was dropped and why, and belong
# back here only when an import justifies them.
dependencies = [
    "fastapi (>=0.115.0)",           # remote/sse_server_daemon.py
    "uvicorn (>=0.34.0)",            # remote/sse_server_daemon.py
    "tblib (>=3.1.0)",               # remote/base_sse_daemon.py, remote/catch_stdio.py
    "aiohttp (>=3.14.3)",            # the SSE daemons
    "aiohttp-sse-client (>=0.2.1)",  # remote/base_sse_daemon.py
    "typing_extensions (>=4.0.0)",   # override_compat.py
    "netifaces (>=0.11.0)",          # remote/tools.py
    # "httpcore (>=1.0.9)",          # never imported; aiohttp is the client here
    # "python-dotenv (>=1.2.2)",     # only the samples read a .env, and they declare it themselves
    # "email-validator>=2.3.0",      # never imported
    # "dnspython>=2.8.0",            # never imported; the DNS pinning calls socket directly
    # "scipy-stubs>=1.15.3.0",       # type stubs, for a package this code never imports
    # "requests>=2.33.0",            # only a docstring example; the integration test declares it
]

[project.optional-dependencies]
# Optional extras per OS sandbox provider (pip install pysandboxes[firejail], etc.)
bwrap = []
firejail = []
landlock = []
subprocess = []
unshare = []
# Install all provider extras: pip install pysandboxes[all]
# Self-referential: no duplication; pip resolves all provider extras.
all = [
    "pysandboxes[bwrap,firejail,landlock,subprocess,unshare]",
]

[project.urls]
repository = "https://www.github.com/pprados/pysandboxes"
homepage = "https://www.github.com/pprados/pysandboxes"
documentation = "https://pprados.github.io/pysandboxes/"

[tool.hatch.build.targets.wheel]
packages = ["pysandboxes"]

[tool.uv]
package = true
exclude-newer = "7 days"
#executable-path = "~/workspace.bda/langgraph-codeagent/.venv/bin/python-sb"
#executable-name = "python-sb"
# dev-dependencies = ["pysandboxes"] # TODO

[project.scripts]
python-sb = "pysandboxes.python_sb:main"
python3-sb = "pysandboxes.python_sb:main"
ipython-sb = "pysandboxes.python_sb:main"
ipython3-sb = "pysandboxes.python_sb:main"

[dependency-groups]
dev = [
    "ipython",
    "pre-commit>=3.6",
    "importlib-metadata==7.2.1",
    #    "pydevd-pycharm>=253.28086.55",
    "rich>=14.0",
    "json-with-comments>=1.2.10",
    "devpi-server>=6.17.0",
    "devpi-web>=5.0.1",
    "devpi-client>=7.2.0",
    "mempalace>=3.0.0",
    "onnxruntime-gpu>=1.24.3",
    "pyright>=1.1.407",
    "pip-audit",
    "pytest-cov>=7.1.0",
]
test = [
    "pytest>=7.3.0",
    "pytest-asyncio>=1.2.0",
    #    "pytest-cov>=4.0.0",
    "pytest-dotenv>=0.5.2",
    "pytest-asyncio>=0.20.3",
    "pytest-mock>=3.10.0",
    "requests>=2.33.0",
    "types-requests>=2.28.11.5",
    "toml>=0.10.2",
    "speckit>=1.0.1",
]
lint = [
    "mypy>=1.8",
    "pyright>=1.1",
    "ruff>=0.14.8",
    "types-requests>=2.28.11.5",
]

[tool.codespell]
# Generated trees, caches and virtualenvs: scanning .venv alone took minutes.
# audits/ and any *_fr.* file are written in French; codespell only knows
# English, so every French word would be reported as a typo. Name a French
# document with the _fr suffix and it is skipped without a new entry here.
# The LaTeX artefacts under research/ are generated from research.md, which is
# checked: re-checking the derived files only reports biblatex's own macro names.
skip = '*/.git,*/.venv,*/node_modules,*/.mypy_cache,*/.pytest_cache,*/.ruff_cache,*/dist,*/.ia_backup,*/graphify-out,*/htmlcov,*/docs/api,*/.agents,*/_bmad,*/wiki/bmad,*/PPR,*/audits,*/TODO.md,*_fr.md,*/research/build,*.tex,*.bib,*.bbl,*.mmd,*.pdf,*.svg,*.yaml,*.ipynb,*.lock,*.min.js,*.css,package-lock.json'
# Ignore latin etc
ignore-regex = '.*(Stati Uniti|Tense=Pres).*'
#ignore-words-list = ''

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # E: Error/Style violation (from Pycodestyle, e.g., indentation, whitespace)
    "F",  # F: Pyflakes errors (e.g., unused imports, undefined names)
    "B",  # B: Bugbear warnings (e.g., common pitfalls, function signatures, use of mutable defaults)
    "W",  # W: Warning (from Pycodestyle, e.g., deprecated usage)
]


[tool.mypy]
ignore_missing_imports = "True"
disallow_untyped_defs = "True"
exclude = []

[tool.pyright]
include = ["pysandboxes", "tests", "samples", "python-sb"]
extraPaths = ["pysandboxes", "python-sb"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportImplicitStringConcatenation = false
reportMissingImports = "warning"
reportAttributeAccessIssue = "warning"
reportAssignmentType = "warning"
reportIncompatibleMethodOverride = "warning"
reportArgumentType = "warning"
reportPossiblyUnboundVariable = "warning"
reportRedeclaration = "warning"
reportInvalidTypeForm = "warning"

[tool.pytest.ini_options]
# --strict-markers will raise errors on unknown marks.
# https://docs.pytest.org/en/7.1.x/how-to/mark.html#raising-errors-on-unknown-marks
#
# https://docs.pytest.org/en/7.1.x/reference/reference.html
# --strict-config       any warnings encountered while parsing the `pytest`
#                       section of the configuration file raise errors.
#
# https://github.com/tophat/syrupy
addopts = "--strict-markers --strict-config --durations=5 -vv"
# Registering custom markers.
# https://docs.pytest.org/en/7.1.x/example/markers.html#registering-markers
markers = [
    "requires: mark tests as requiring a specific library",
    "scheduled: mark tests to run in scheduled testing",
    "compile: mark placeholder test used to compile integration tests without running them",
    "slow: mark tests whose cost is measured in minutes (deselect with -m 'not slow')"
]
asyncio_mode = "auto"
