# Exposes /dev/kvm to pods that are not privileged, as a Kubernetes device plugin does on a real cluster:
# a pod asks for `pysandboxes.test/kvm: 1` and receives the device, with no `privileged` and no host path.
# Derived from https://github.com/squat/generic-device-plugin/blob/main/manifests/generic-device-plugin.yaml,
# reduced to the one device smolvm needs. Applied by the container tests that need KVM without privileges.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: generic-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: generic-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: generic-device-plugin
    spec:
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      containers:
        - name: generic-device-plugin
          image: squat/generic-device-plugin
          args:
            - --domain
            - pysandboxes.test
            - --device
            - |
              name: kvm
              groups:
                - count: 4
                  paths:
                    - path: /dev/kvm
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
  updateStrategy:
    type: RollingUpdate
