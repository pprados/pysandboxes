[project]
name = "mcp-server"
version = "0.1.0"
description = "A simple MCP server"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Anthropic" }]
keywords = ["mcp", ]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "click>=8.2",
    "debugpy>=1.8.17",
    "mcp>=1.14",

    "pysandboxes>=0.0"
]

[project.scripts]
mcp-simple-auth-client = "mcp_server.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.pyright]
include = ["mcp_server"]
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.uv]
dev-dependencies = ["pyright>=1.1.379", "pytest>=8.3.3", "ruff>=0.6.9"]

[tool.uv.sources]
# Use only inside the pysandboxes git repository
pysandboxes = { path = "../.." }

[[tool.uv.index]]
url = "https://pypi.org/simple"
