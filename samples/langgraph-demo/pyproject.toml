[project]
name = "langgraph-demo"
version = "0.1.0"
description = "LangGraph chatbot demo with calculator and web fetcher tools"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pysandboxes",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "markdownify>=0.13.0",
    "python-dotenv>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.1",
    "langgraph>=1.0.1",
]

[dependency-groups]
dev = [
    "ipython",
#    "pydevd-pycharm>=253.28086.55",
    "mcp-server",
]

test = [
    "pytest>=7.3.0",
    "pytest-asyncio>=1.2.0",
    "pytest-dotenv>=0.5.2",
    "pytest-asyncio>=0.20.3",
    "pytest-mock>=3.10.0",
]

[project.scripts]
langgraph-chat = "langgraph_simple_chatbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langgraph_simple_chatbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.sources]
# Use only inside the pysandboxes git repository
pysandboxes = { path = "../..", editable = true }
#pysandboxes = { path = "../../dist/pysandboxes-0.0.0-py3-none-any.whl" }

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
