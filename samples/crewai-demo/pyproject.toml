[project]
name = "crewai-demo"
version = "0.1.0"
description = "CrewAI console demo with web fetch and Python execution tools"
readme = "README.md"
requires-python = ">=3.11.5"
authors = [{ name = "Philippe PRADOS" }]
keywords = ["sandboxes", "crewai", "llm", "tools", "agent"]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pysandboxes",
    "markdownify>=1.2.0",
    # Native + LiteLLM-backed providers (see README). Extras match PyPI optional deps.
    "crewai[anthropic,aws,azure-ai-inference,bedrock,google-genai,litellm]>=1.11",
    "httpx>=0.28",
    # Pin the transitive dependency so Intel macOS can use the tagged source below.
    "lancedb==0.30.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ipython",
    "pyright>=1.1.379",
    "ruff>=0.6.9",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]
codespell = [
    "codespell>=2.2.5",
]

[project.scripts]
crewai-demo = "crewai_demo.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crewai_demo"]

[tool.pyright]
include = ["crewai_demo", "tests"]
venvPath = "."
venv = ".venv"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.codespell]
skip = ".git,*.pdf,*.svg,*.yaml,*.ipynb,uv.lock,./.venv"

[tool.uv]
# crewai 1.15.21 -- its latest release -- pins `chromadb~=1.1.0`, and chromadb
# 1.1.1 still imports the `pydantic.v1` shim, which refuses to build its models
# on Python 3.14: "Core Pydantic V1 functionality isn't compatible with Python
# 3.14 or greater". The suite then dies during collection, before any sandbox
# runs. chromadb 1.5 dropped the shim, so the override is what lets this sample
# cover every version the project claims.
#
# The risk is carried knowingly: crewai does not test against chromadb 1.5. It
# is small here because the sample uses neither RAG, memory nor knowledge --
# chromadb only arrives as a transitive import. Re-check when crewai next moves:
# if it relaxes the pin, drop this override.
#
# Same for `mcp`: crewai pins `mcp~=1.28.1`, which is vulnerable to CVE-2026-59951
# (fixed in 1.30.0). The sample uses no MCP server. Drop the override once crewai
# allows mcp >= 1.30.
override-dependencies = [
    "chromadb>=1.5",
    "mcp>=1.30.0,<2",
    # ONNX Runtime 1.29 has no Intel macOS wheel. 1.23.2 is the newest
    # Intel wheel and supports Python through 3.13.
    "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version < '3.14'",
]

[tool.uv.sources]
# Use only inside the pysandboxes git repository
pysandboxes = { path = "../..", editable = true }
# LanceDB does not publish an Intel macOS wheel. uv builds the pinned upstream
# release on Intel and uses PyPI on ARM macOS.
[tool.uv.sources.lancedb]
git = "https://github.com/lancedb/lancedb"
tag = "python-v0.30.0"
subdirectory = "python"
marker = "sys_platform == 'darwin' and platform_machine == 'x86_64'"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -vv"
