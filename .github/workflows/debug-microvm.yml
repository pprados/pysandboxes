name: Debug microvm
on:
  push:
    branches: [worktree-fix-release-ci]
    paths: [.github/workflows/debug-microvm.yml]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.13"
      UV_PYTHON_PREFERENCE: only-managed
      QEMU_MICROVM_OPTIONAL_PATHS: /etc/ssl,/etc/ca-certificates,/usr/share/ca-certificates
      QEMU_MICROVM_EMPTY_PATHS: /etc/pki
    steps:
    - uses: actions/checkout@v5
    - name: Give the runner user /dev/kvm
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        test -c /dev/kvm
    - name: Install build tools and QEMU
      run: sudo apt-get update && sudo apt-get install -y make build-essential qemu-system-x86 qemu-utils genisoimage 7zip python3-dev
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - run: uv sync --group test
    - name: Fetch QEMU image and boot artifacts
      run: |
        uv run python -m pysandboxes.remote.qemu_fetch_image
        uv run python -c 'from pysandboxes.remote.qemu_image import get_default_image_path; from pysandboxes.remote.qemu_microvm_boot import ensure_microvm_boot_artifacts; ensure_microvm_boot_artifacts(get_default_image_path(), {})'
    - name: Run the agno-demo sample with the console shown
      env:
        OS_SANDBOX: qemu-microvm
        QEMU_USE_KVM: "true"
      run: |
        cd samples/agno-demo
        printf '\nqemu.show_boot_console=true\nqemu.start_timeout=120\n' | tee -a .py-sandboxes .py-sandboxes-complete >/dev/null
        make init >/dev/null 2>&1
        nproc; free -m | head -2
        .venv/bin/python -m pytest tests/test_tools_sandbox.py -x -s -k b2_an_allowed -p no:cacheprovider > "$RUNNER_TEMP/out.log" 2>&1 || true
        wc -l "$RUNNER_TEMP/out.log"
        grep -nE 'pysandbox|PYSANDBOX|\[ +[0-9.]+\]|Kernel|qemu|Mount|mount|9p|Failed|Error' "$RUNNER_TEMP/out.log" | head -150 | cut -c1-240
