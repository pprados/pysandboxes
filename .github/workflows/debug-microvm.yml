name: Debug microvm
on:
  push:
    branches: [worktree-fix-release-ci]
    paths: [.github/workflows/debug-microvm.yml]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.13"
      UV_PYTHON_PREFERENCE: only-managed
      QEMU_MICROVM_OPTIONAL_PATHS: /etc/ssl,/etc/ca-certificates,/usr/share/ca-certificates
      QEMU_MICROVM_EMPTY_PATHS: /etc/pki
    steps:
    - uses: actions/checkout@v5
    - name: Give the runner user /dev/kvm
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        test -c /dev/kvm
    - name: Install build tools and QEMU
      run: sudo apt-get update && sudo apt-get install -y make build-essential qemu-system-x86 qemu-utils genisoimage 7zip python3-dev
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - run: uv sync --group test
    - name: Fetch QEMU image and boot artifacts
      run: |
        uv run python -m pysandboxes.remote.qemu_fetch_image
        uv run python -c 'from pysandboxes.remote.qemu_image import get_default_image_path; from pysandboxes.remote.qemu_microvm_boot import ensure_microvm_boot_artifacts; ensure_microvm_boot_artifacts(get_default_image_path(), {})'
    - name: Boot a microvm with the console shown
      run: |
        printf 'os-sandbox=qemu-microvm\nqemu.show_boot_console=true\nqemu.start_timeout=120\npython-import=ALLOW:*\n' > "$RUNNER_TEMP/mv.profile"
        qemu-system-x86_64 --version | head -1
        timeout 200 uv run python -m pysandboxes.python_sb --pysandboxes-config="$RUNNER_TEMP/mv.profile" -c 'print("HELLO")' 2>&1 | tail -150
