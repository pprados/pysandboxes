#
# Publishes a signed tag: a pre-release vX.Y.Z(a|b|rc)N goes to test.pypi.org, a final vX.Y.Z to
# pypi.org, after the full test gate; then the container images go to Docker Hub, and a final version fast-forwards
# master. This file and every file of the tagged commit are attacker-controlled input: what
# protects the release lives in the GitHub settings (tag ruleset on v*, reviewers on the testpypi and pypi
# environments, the dockerhub environment restricted to v* tags, RELEASE_ALLOWED_SIGNERS).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
      final: ${{ steps.tag.outputs.final }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    # actions/checkout replaces the annotated tag with a lightweight one, which drops the signature.
    - name: Fetch the annotated tag
      run: git fetch --force origin "refs/tags/${GITHUB_REF#refs/tags/}:refs/tags/${GITHUB_REF#refs/tags/}"

    - name: Check the tag name, signature and ancestry
      id: tag
      env:
        ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
      run: .github/scripts/verify-release-tag.sh "$GITHUB_REF" >>"$GITHUB_OUTPUT"

  # lint.yml and test.yml do not run on tags: wait for their runs on the develop push of the tagged commit.
  # GitHub only runs them on the head of a push: review origin/develop, then tag its head, or this job times out.
  push-checks:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
    - name: Wait for lint.yml and test.yml on the tagged commit
      run: |
        deadline=$((SECONDS + 1800))
        for workflow in lint.yml test.yml; do
          while :; do
            runs=$(gh run list --commit "$SHA" --workflow "$workflow" --event push --json status,conclusion)
            if jq -e 'any(.status == "completed" and .conclusion != "success")' <<<"$runs" >/dev/null; then
              echo "::error::$workflow did not succeed on $SHA"
              exit 1
            fi
            if jq -e 'length > 0 and all(.status == "completed")' <<<"$runs" >/dev/null; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::push checks not finished"
              exit 1
            fi
            sleep 30
          done
        done

  # make validate adds pip-audit, which may turn red between the develop push and the tag.
  validate:
    needs: verify
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y make build-essential

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: "3.13"

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/0.11.16/install.sh | sh

    - name: Install dependencies
      run: uv sync --locked --group dev --group test --group lint

    - name: Validate
      run: make -o uv.lock validate

  build:
    needs: [verify, push-checks, validate]
    runs-on: ubuntu-latest
    outputs:
      python-sb: ${{ steps.python-sb.outputs.publish }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/0.11.16/install.sh | sh

    - name: Build
      run: uv build

    - name: Check the version and the metadata
      run: |
        shopt -s nullglob
        wheels=(dist/*.whl)
        if [[ ${#wheels[@]} != 1 || ${wheels[0]} != dist/pysandboxes-"$VERSION"-* ]]; then
          echo "::error::built ${wheels[*]}, expected pysandboxes $VERSION"
          exit 1
        fi
        uvx twine check --strict dist/*

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: dist
        path: dist/
        if-no-files-found: error

    # python-sb/ is a separate package, the one behind `uvx python-sb`. It goes out with a release only when one of
    # its files changed since the previous tag, and is kept out of dist/, which the images and their checks read.
    - name: Decide whether python-sb is published
      id: python-sb
      run: .github/scripts/python-sb-changes.sh "$GITHUB_REF_NAME" >>"$GITHUB_OUTPUT"

    - name: Build python-sb
      if: steps.python-sb.outputs.publish == 'true'
      run: |
        uv build python-sb --out-dir dist-python-sb
        uvx twine check --strict dist-python-sb/*

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      if: steps.python-sb.outputs.publish == 'true'
      with:
        name: python-sb
        path: dist-python-sb/
        if-no-files-found: error

  # A tag on a commit a nightly already proved reuses that run rather than repeating its suites.
  reuse-lookup:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      reuse: ${{ steps.lookup.outputs.reuse }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    - name: Look for a green nightly full gate on the tagged commit
      id: lookup
      run: |
        .github/scripts/find-nightly-gate.sh "$SHA" >"$RUNNER_TEMP/lookup"
        cat "$RUNNER_TEMP/lookup" >>"$GITHUB_OUTPUT"
        cat "$RUNNER_TEMP/lookup" >>"$GITHUB_STEP_SUMMARY"

  # The release leaves the qemu-tcg rows out: the nightly runs them.
  full-gate:
    needs: reuse-lookup
    if: needs.reuse-lookup.outputs.reuse != 'true'
    uses: ./.github/workflows/full-gate.yml
    with:
      exclude-tcg: true

  # Tests run from the checkout import the source tree, so a file left out of the wheel passes them. These run
  # against the wheel about to be published, installed in a venv that holds the test dependencies but not the project.
  wheel-tests:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y make build-essential python3-dev

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/0.11.16/install.sh | sh

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist
        path: dist/

    - name: Install the wheel into a venv without the project
      run: |
        uv sync --locked --no-install-project --group test
        uv pip install dist/*.whl

    # PYTHONSAFEPATH keeps the current directory, the checkout, off sys.path; the venv's pytest script and
    # --import-mode=importlib keep the test directories off it too.
    - name: Check that pysandboxes comes from the wheel
      env:
        PYTHONSAFEPATH: "1"
      run: |
        .venv/bin/python - <<'EOF'
        import pysandboxes
        print(pysandboxes.__file__)
        assert "site-packages" in pysandboxes.__file__, "pysandboxes was imported from the checkout"
        EOF

    - name: Run the unit tests against the wheel
      env:
        PYTHONSAFEPATH: "1"
      run: .venv/bin/pytest tests/unit_tests --import-mode=importlib -p no:cacheprovider

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      if: needs.build.outputs.python-sb == 'true'
      with:
        name: python-sb
        path: dist-python-sb/

    # --no-deps: pysandboxes is the wheel installed above, not a release resolved from an index. pysandboxes ships a
    # python-sb script too, so the wrapper is called through its own module.
    - name: Run the python-sb wrapper from its wheel
      if: needs.build.outputs.python-sb == 'true'
      env:
        PYTHONSAFEPATH: "1"
      run: |
        uv pip install --no-deps dist-python-sb/*.whl
        .venv/bin/python -c "import sys, python_sb; sys.argv = ['python-sb', '--help']; python_sb.main()" >/dev/null

  # Trusted Publishing (no stored token); the action generates the PEP 740 attestations.
  # The testpypi reviewer is the single approval, asked once every job this one needs has passed. A skipped
  # full-gate counts as passed only when the lookup chose reuse, never when an upstream failure skipped it.
  publish-testpypi:
    needs: [verify, build, reuse-lookup, full-gate, wheel-tests]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.wheel-tests.result == 'success'
      && needs.reuse-lookup.result == 'success'
      && (needs.reuse-lookup.outputs.reuse == 'true' || needs.full-gate.result == 'success')
      && needs.verify.outputs.final == 'false' }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pysandboxes/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist
        path: dist/

    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      if: needs.build.outputs.python-sb == 'true'
      with:
        name: python-sb
        path: dist-python-sb/

    # test.pypi.org needs a trusted publisher for the python-sb project too (same workflow and environment).
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      if: needs.build.outputs.python-sb == 'true'
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: dist-python-sb/
        skip-existing: true

  # The pypi reviewer is the single approval of a final tag, as testpypi is for a pre-release.
  publish-pypi:
    needs: [verify, build, reuse-lookup, full-gate, wheel-tests]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.wheel-tests.result == 'success'
      && needs.reuse-lookup.result == 'success'
      && (needs.reuse-lookup.outputs.reuse == 'true' || needs.full-gate.result == 'success')
      && needs.verify.outputs.final == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pysandboxes/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist
        path: dist/

    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      with:
        skip-existing: true

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      if: needs.build.outputs.python-sb == 'true'
      with:
        name: python-sb
        path: dist-python-sb/

    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      if: needs.build.outputs.python-sb == 'true'
      with:
        packages-dir: dist-python-sb/
        skip-existing: true

  # The images are built from the dist/ artifact, not from the index; this proves the index holds the same file.
  verify-published:
    needs: [verify, publish-testpypi, publish-pypi]
    if: >-
      ${{ !cancelled()
      && (needs.publish-testpypi.result == 'success' || needs.publish-pypi.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: "3.13"

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist
        path: dist/

    - name: Check that the index serves the built wheel
      env:
        INDEX_URL: >-
          ${{ needs.verify.outputs.final == 'true' && 'https://pypi.org/simple/'
          || 'https://test.pypi.org/simple/' }}
      run: .github/scripts/verify-published.sh "$VERSION" dist/pysandboxes-"$VERSION"-*.whl

  # No reviewer of its own: the testpypi or pypi approval covers the images, and the dockerhub environment,
  # which holds the only push credential, accepts v* tags only, which the tag ruleset reserves to the maintainer.
  images:
    needs: [verify, verify-published]
    if: ${{ !cancelled() && vars.RELEASE_IMAGES != 'false' && needs.verify-published.result == 'success' }}
    runs-on: ubuntu-latest
    environment: dockerhub
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      UV_PYTHON: "3.13"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y make build-essential

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: "3.13"

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/0.11.16/install.sh | sh

    - name: Install dependencies
      run: uv sync --locked

    # Before the build, so the base image pulls are authenticated and escape the anonymous rate limit.
    - name: Log in to Docker Hub
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist
        path: dist/

    # A fresh checkout's mtimes would make .make-dist rerun uv build, which deletes the downloaded wheel.
    - name: Build the five images from the published wheel
      run: |
        touch .make-dist
        make -o uv.lock CONTAINER_CMDS=docker PYTHON_VERSION=3.13 build-images

    - name: Smoke-test the images
      run: .github/scripts/smoke-test-images.sh "$VERSION" 3.13

    - name: Push the version tags
      run: |
        for image in python-sb python-sb-landlock python-sb-unshare python-sb-bwrap python-sb-qemu; do
          target="docker.io/pprados/$image:$VERSION"
          docker tag "$image:3.13" "$target"
          docker push "$target"
          echo "- \`$(docker inspect --format '{{index .RepoDigests 0}}' "$target")\`" >>"$GITHUB_STEP_SUMMARY"
        done

  # Final versions only, once everything is published. Without --force: a master that is not an ancestor of the tag
  # makes the push fail instead of being rewritten.
  advance-master:
    needs: [verify, verify-published, images]
    if: >-
      ${{ !cancelled() && needs.verify.outputs.final == 'true' && needs.verify-published.result == 'success'
      && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    - name: Fast-forward master to the tagged commit
      run: git push origin "$SHA:refs/heads/master"
