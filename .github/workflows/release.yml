#
# Publishes a signed pre-release tag vX.Y.Z(a|b|rc)N: wheel to test.pypi.org, or to the local devpi when replayed
# by `make release-beta-local` (the bench's event carries "act": true, which no GitHub event has).
# This file and every file of the tagged commit are attacker-controlled input: what protects the release lives in
# the GitHub settings (tag ruleset on v*, reviewer on the testpypi environment, RELEASE_ALLOWED_SIGNERS).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    # actions/checkout replaces the annotated tag with a lightweight one, which drops the signature.
    - name: Fetch the annotated tag
      if: ${{ !github.event.act }}
      run: git fetch --force origin "refs/tags/${GITHUB_REF#refs/tags/}:refs/tags/${GITHUB_REF#refs/tags/}"

    - name: Check the tag name, signature and ancestry
      id: tag
      env:
        ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
      run: .github/scripts/verify-release-tag.sh "$GITHUB_REF" >>"$GITHUB_OUTPUT"

  # lint.yml and test.yml do not run on tags: wait for their runs on the develop push of the tagged commit.
  # GitHub only runs them on the head of a push: review origin/develop, then tag its head, or this job times out.
  push-checks:
    needs: verify
    if: ${{ !github.event.act }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
    - name: Wait for lint.yml and test.yml on the tagged commit
      run: |
        deadline=$((SECONDS + 1800))
        for workflow in lint.yml test.yml; do
          while :; do
            runs=$(gh run list --commit "$SHA" --workflow "$workflow" --event push --json status,conclusion)
            if jq -e 'any(.status == "completed" and .conclusion != "success")' <<<"$runs" >/dev/null; then
              echo "::error::$workflow did not succeed on $SHA"
              exit 1
            fi
            if jq -e 'length > 0 and all(.status == "completed")' <<<"$runs" >/dev/null; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::push checks not finished"
              exit 1
            fi
            sleep 30
          done
        done

  # make validate adds pip-audit, which may turn red between the develop push and the tag.
  validate:
    needs: verify
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y make build-essential

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: "3.13"

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/0.11.16/install.sh | sh

    - name: Install dependencies
      run: uv sync --locked --group dev --group test --group lint

    - name: Validate
      run: make -o uv.lock validate

  # A skipped job in `needs` skips this one too: push-checks is skipped under act, hence the explicit condition.
  build:
    needs: [verify, push-checks, validate]
    if: >-
      ${{ !cancelled() && needs.validate.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.push-checks.result) }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/0.11.16/install.sh | sh

    - name: Build
      run: uv build

    - name: Check the version and the metadata
      run: |
        shopt -s nullglob
        wheels=(dist/*.whl)
        if [[ ${#wheels[@]} != 1 || ${wheels[0]} != dist/pysandboxes-"$VERSION"-* ]]; then
          echo "::error::built ${wheels[*]}, expected pysandboxes $VERSION"
          exit 1
        fi
        uvx twine check --strict dist/*

    - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  # Trusted Publishing (no stored token); the action generates the PEP 740 attestations.
  # The testpypi environment keeps the maintainer as required reviewer until the approve job exists.
  publish-testpypi:
    needs: [verify, build]
    if: ${{ !github.event.act }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pysandboxes/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
      with:
        name: dist
        path: dist/

    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true

  # Local bench only: devpi's dev index is volatile, so the same tag can be replayed.
  # Explicit condition: push-checks, an ancestor through build, is skipped under act.
  publish-devpi:
    needs: build
    if: ${{ !cancelled() && github.event.act && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
      with:
        name: dist
        path: dist/

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/0.11.16/install.sh | sh

    # act sets GITHUB_ACTIONS: without --trusted-publishing never, uv would ask the runner for an OIDC token.
    - name: Publish to devpi
      env:
        UV_PUBLISH_USERNAME: ${{ secrets.DEVPI_USER }}
        UV_PUBLISH_PASSWORD: ${{ secrets.DEVPI_PASS }}
      run: uv publish --trusted-publishing never --publish-url "http://localhost:3141/$UV_PUBLISH_USERNAME/dev/" dist/*
