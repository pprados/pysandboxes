# License: Apache V2
#
# Publishes a signed pre-release tag vX.Y.Z(a|b|rc)N: wheel to test.pypi.org, after the full test gate.
# This file and every file of the tagged commit are attacker-controlled input: what protects the release lives in
# the GitHub settings (tag ruleset on v*, reviewer on the testpypi environment, RELEASE_ALLOWED_SIGNERS).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    # actions/checkout replaces the annotated tag with a lightweight one, which drops the signature.
    - name: Fetch the annotated tag
      run: git fetch --force origin "refs/tags/${GITHUB_REF#refs/tags/}:refs/tags/${GITHUB_REF#refs/tags/}"

    - name: Check the tag name, signature and ancestry
      id: tag
      env:
        ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
      run: .github/scripts/verify-release-tag.sh "$GITHUB_REF" >>"$GITHUB_OUTPUT"

  # lint.yml and test.yml do not run on tags: wait for their runs on the develop push of the tagged commit.
  # GitHub only runs them on the head of a push: review origin/develop, then tag its head, or this job times out.
  push-checks:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
    - name: Wait for lint.yml and test.yml on the tagged commit
      run: |
        deadline=$((SECONDS + 1800))
        for workflow in lint.yml test.yml; do
          while :; do
            runs=$(gh run list --commit "$SHA" --workflow "$workflow" --event push --json status,conclusion)
            if jq -e 'any(.status == "completed" and .conclusion != "success")' <<<"$runs" >/dev/null; then
              echo "::error::$workflow did not succeed on $SHA"
              exit 1
            fi
            if jq -e 'length > 0 and all(.status == "completed")' <<<"$runs" >/dev/null; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::push checks not finished"
              exit 1
            fi
            sleep 30
          done
        done

  # make validate adds pip-audit, which may turn red between the develop push and the tag.
  validate:
    needs: verify
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y make build-essential

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: "3.13"

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/0.11.16/install.sh | sh

    - name: Install dependencies
      run: uv sync --locked --group dev --group test --group lint

    - name: Validate
      run: make -o uv.lock validate

  build:
    needs: [verify, push-checks, validate]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/0.11.16/install.sh | sh

    - name: Build
      run: uv build

    - name: Check the version and the metadata
      run: |
        shopt -s nullglob
        wheels=(dist/*.whl)
        if [[ ${#wheels[@]} != 1 || ${wheels[0]} != dist/pysandboxes-"$VERSION"-* ]]; then
          echo "::error::built ${wheels[*]}, expected pysandboxes $VERSION"
          exit 1
        fi
        uvx twine check --strict dist/*

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  # A tag on a commit a nightly already proved reuses that run rather than repeating its suites.
  reuse-lookup:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      reuse: ${{ steps.lookup.outputs.reuse }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.verify.outputs.sha }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    - name: Look for a green nightly full gate on the tagged commit
      id: lookup
      run: |
        .github/scripts/find-nightly-gate.sh "$SHA" >"$RUNNER_TEMP/lookup"
        cat "$RUNNER_TEMP/lookup" >>"$GITHUB_OUTPUT"
        cat "$RUNNER_TEMP/lookup" >>"$GITHUB_STEP_SUMMARY"

  # The release leaves the qemu-tcg rows out: the nightly runs them.
  full-gate:
    needs: reuse-lookup
    if: needs.reuse-lookup.outputs.reuse != 'true'
    uses: ./.github/workflows/full-gate.yml
    with:
      exclude-tcg: true

  # Tests run from the checkout import the source tree, so a file left out of the wheel passes them. These run
  # against the wheel about to be published, installed in a venv that holds only the test dependencies.
  wheel-tests:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y make build-essential python3-dev

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/0.11.16/install.sh | sh

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist
        path: dist/

    - name: Install the wheel into a venv without the project
      run: |
        uv sync --locked --no-install-project --group test
        uv pip install dist/*.whl

    # PYTHONSAFEPATH keeps the current directory, the checkout, off sys.path; the venv's pytest script and
    # --import-mode=importlib keep the test directories off it too.
    - name: Check that pysandboxes comes from the wheel
      env:
        PYTHONSAFEPATH: "1"
      run: |
        .venv/bin/python - <<'EOF'
        import pysandboxes
        print(pysandboxes.__file__)
        assert "site-packages" in pysandboxes.__file__, "pysandboxes was imported from the checkout"
        EOF

    - name: Run the unit tests against the wheel
      env:
        PYTHONSAFEPATH: "1"
      run: .venv/bin/pytest tests/unit_tests --import-mode=importlib -p no:cacheprovider

  # Trusted Publishing (no stored token); the action generates the PEP 740 attestations.
  # The testpypi reviewer is the single approval, asked once every job this one needs has passed. A skipped
  # full-gate counts as passed only when the lookup chose reuse, never when an upstream failure skipped it.
  publish-testpypi:
    needs: [verify, build, reuse-lookup, full-gate, wheel-tests]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.wheel-tests.result == 'success'
      && needs.reuse-lookup.result == 'success'
      && (needs.reuse-lookup.outputs.reuse == 'true' || needs.full-gate.result == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pysandboxes/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist
        path: dist/

    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
