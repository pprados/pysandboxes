name: CrewAI macOS ARM

on:
  push:
    paths:
    - .github/workflows/crewai-macos.yml
    - samples/crewai-demo/**
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.13"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

    - name: Verify ARM64 runner
      run: test "$(uname -m)" = arm64

    - name: Set up Python 3.13
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        version: "0.11.16"

    - name: Check installation of uv
      run: test "$(uv --version)" = "uv 0.11.16"

    - name: Install CrewAI sample dependencies
      run: make -C samples/crewai-demo init

    - name: Prepare sample data directories
      run: mkdir -p "$HOME/.local/share/crewai-demo" "$HOME/.local/share/crewai/credentials"

    - name: Test CrewAI sample
      run: make -C samples/crewai-demo tests
