#
# Starts the nightly Full Gate on develop. GitHub fires schedule: only from the default branch, which will be master:
# the cron lives here and dispatches full-gate.yml on develop, so the nightly tests the working branch whichever branch
# is the default. Scheduled runs are late on this repository, by about 3 hours: the nightly still ends before the
# working day.
name: Nightly

on:
  schedule:
    # 18:30 UTC (19:30 in Paris in winter, 20:30 in summer: a cron is in UTC and ignores daylight saving time): off the
    # hour, when scheduled runs pile up. GitHub fires this schedule late, by up to about 6 hours.
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Start the Full Gate on develop
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run full-gate.yml --repo "$GITHUB_REPOSITORY" --ref develop -f nightly=true
