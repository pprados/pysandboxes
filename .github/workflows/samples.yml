name: Sample Tests

# Runs the samples' own suites nightly and at publication time. They are heavy
# -- twelve projects, each with its own pyproject.toml, uv.lock and venv -- so
# they are tied to a version tag rather than to every push. workflow_dispatch
# reruns them on demand.
#
# The nightly run validates the integration branch, `develop`. GitHub only honours
# `schedule:` on the default branch, which is `develop`, so the schedule already
# fires from the branch under test; the pinning step below states that contract in
# the tree rather than leaving it to a repository setting no file records. A night
# without a commit on `develop` is skipped by the `changes` job -- re-running the
# same tree teaches nothing. A tag push keeps testing the tag, and is never skipped.
#
# Every interpreter the project claims is covered, 3.11 through 3.14: a sample's
# .py-sandboxes profile is learned under one version and the set of modules the
# interpreter loads differs between them, so a profile green on 3.13 can refuse
# an import on 3.11. langgraph-demo declares requires-python >=3.13 and is
# skipped on the two lower rows by sample-tests-%.
#
# No secret is needed: pydantic-ai drives TestModel behind a placeholder key,
# openai-agents-sdk is mocked, and the suites that would reach a real model
# (mcp-client, mcp-server) skip themselves when OPENAI_API_KEY / RUN_CLAUDE_TESTS
# are unset. The test_tools_sandbox.py suites do use the real network, which a
# hosted runner provides.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

jobs:
  # A cheap guard job rather than a step: it keeps the whole setup -- apt, uv,
  # twelve `uv sync` runs -- out of a night that has nothing new to test.
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commits.outputs.changed }}

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        # `git rev-list --since` needs the history the default shallow clone omits.
        fetch-depth: 0

    - name: Move to the integration branch
      if: github.event_name == 'schedule'
      run: git checkout -B develop origin/develop

    - name: Look for commits from the last day
      id: commits
      run: |
        count=$(git rev-list --count --since='24 hours ago' HEAD)
        echo "$count commit(s) in the last 24 hours"
        if [ "$count" -gt 0 ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

  samples:
    needs: changes
    # Only the nightly run is skippable: a tag push, a manual dispatch, and a
    # local `act` run always execute the suites.
    if: github.event_name != 'schedule' || needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    # Pins the interpreter for every uv call in the sample Makefiles, and tells
    # sample-tests-% which version it is running: a sample whose requires-python
    # excludes it is skipped rather than failed. Without this uv picks whatever
    # the runner happens to offer, which is how a suite learned on one version
    # ended up green by luck and red on another.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # The branch under test is `develop`, not the branch the schedule fired from.
    # Done here rather than through `actions/checkout`'s `ref:` input: `act` only
    # substitutes its bind of the working directory when that input is absent, and
    # the real action it otherwise runs wants credentials a local run has no reason
    # to hold. Keeping `with:` free of `ref` is what keeps `make gh-tests` working.
    - name: Move to the integration branch
      if: github.event_name == 'schedule'
      run: |
        git fetch --depth=1 origin develop
        git checkout -B develop FETCH_HEAD

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y make build-essential

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python development headers
      run: sudo apt-get install -y python3-dev

    - name: Install uv
      shell: bash
      run: |
        UV_VERSION="0.8.17"
        UV_BIN_DIR="$RUNNER_TEMP/uv_bin"
        mkdir -p "$UV_BIN_DIR"

        # Download binary Linux/x86_64
        curl -LsSf https://astral.sh/uv/install.sh | sh -s --

        echo "$UV_BIN_DIR" >> $GITHUB_PATH

    - name: Check installation of uv
      run: uv --version

    # The SAMPLES list lives in the root Makefile, so a sample commented out
    # there disappears here too. Sequential on purpose: these suites arm real
    # sandboxes, and an armed sandbox left behind by one suite changes what the
    # next one measures. `make -jN sample-tests` works locally, but a tag-time
    # job can absorb the wall clock in exchange for isolation.
    - name: Run the samples' test suites
      run: make sample-tests
