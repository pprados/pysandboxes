name: Sample Tests

# Runs the samples' own suites. Called by full-gate.yml (nightly on develop, and for a release tag whose commit no
# nightly proved), plus on demand. They are heavy -- twelve projects, each with its own pyproject.toml, uv.lock and
# venv -- so they are not tied to every push.
#
# The nightly run validates the integration branch, `develop`: GitHub only honours `schedule:` on the default
# branch, and full-gate.yml, which holds the schedule, skips a night without a commit.
#
# Every interpreter the project claims is covered, 3.11 through 3.14: a sample's
# .py-sandboxes profile is learned under one version and the set of modules the
# interpreter loads differs between them, so a profile green on 3.13 can refuse
# an import on 3.11. langgraph-demo declares requires-python >=3.13 and is
# skipped on the two lower rows by sample-tests-%.
#
# Every OS provider that confines a sample is covered too: each sample profile
# reads os-sandbox=${OS_SANDBOX:-subprocess}, and a provider adds limits of its
# own -- firejail refused a /proc whitelist and capped the address space, bwrap
# lost editable installs and the working directory -- that no subprocess run can
# show. A minor release must not ship a sample broken under one of them. `none`
# confines nothing, so the confinement scenarios fail there by design; qemu boots
# a VM per sandbox and is covered by integration.yml.
#
# No secret is needed: pydantic-ai drives TestModel behind a placeholder key,
# openai-agents-sdk is mocked, and the suites that would reach a real model
# (mcp-client, mcp-server) skip themselves when OPENAI_API_KEY / RUN_CLAUDE_TESTS
# are unset. The test_tools_sandbox.py suites do use the real network, which a
# hosted runner provides.
on:
  workflow_dispatch:
    inputs:
      vm-python-versions:
        description: JSON list of Python minors for the costly VM sample lane
        type: string
        default: '["3.13"]'
      exclude-tcg:
        description: Leave the emulated (TCG) sample row out
        type: boolean
        default: false
  workflow_call:
    inputs:
      vm-python-versions:
        type: string
        default: '["3.13"]'
      exclude-tcg:
        type: boolean
        default: false

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os-sandbox: [subprocess, landlock, bwrap, firejail, unshare, gvisor]

    # Pins the interpreter for every uv call in the sample Makefiles, and tells
    # sample-tests-% which version it is running: a sample whose requires-python
    # excludes it is skipped rather than failed. Without this uv picks whatever
    # the runner happens to offer, which is how a suite learned on one version
    # ended up green by luck and red on another.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      OS_SANDBOX: ${{ matrix.os-sandbox }}
      SAMPLE_ATTEMPTS: "3"

    steps:
    - uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y make build-essential

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python development headers
      run: sudo apt-get install -y python3-dev

    - name: Install uv
      shell: bash
      run: |
        UV_VERSION="0.8.17"
        UV_BIN_DIR="$RUNNER_TEMP/uv_bin"
        mkdir -p "$UV_BIN_DIR"

        # Download binary Linux/x86_64
        curl -LsSf https://astral.sh/uv/install.sh | sh -s --

        echo "$UV_BIN_DIR" >> $GITHUB_PATH

    - name: Check installation of uv
      run: uv --version

    # The same preparation as integration.yml. Ubuntu 24.04 restricts unprivileged
    # user namespaces through AppArmor, which bwrap and unshare need; firejail only
    # filters a network with 'restricted-network no', and then joins docker0, which
    # the runner routes to the internet the samples reach.
    - name: Install the OS providers
      run: |
        sudo apt-get install -y bubblewrap firejail slirp4netns iptables iproute2
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
        sudo sed -i -E '/^[[:space:]]*restricted-network[[:space:]]+/d' /etc/firejail/firejail.config
        echo 'restricted-network no' | sudo tee -a /etc/firejail/firejail.config

    # runsc comes with a sidecar directory (/usr/bin/gvisor-bin): the apt package installs both, a lone binary
    # fails at its first guest. The key and repository are those of Dockerfile-gvisor.
    - name: Install gVisor
      run: |
        curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
          | sudo tee /etc/apt/sources.list.d/gvisor.list
        sudo apt-get update && sudo apt-get install -y runsc

    # The SAMPLES list lives in the root Makefile, so a sample commented out
    # there disappears here too. Sequential on purpose: these suites arm real
    # sandboxes, and an armed sandbox left behind by one suite changes what the
    # next one measures. `make -jN sample-tests` works locally, but a nightly or
    # release job can absorb the wall clock in exchange for isolation.
    - name: Run the samples' test suites
      run: make sample-tests

  vm-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.vm-python-versions || '["3.13"]') }}
        os-sandbox: [qemu-microvm]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_PREFERENCE: only-managed
      OS_SANDBOX: ${{ matrix.os-sandbox }}
      PYSANDBOXES_FAIL_ON_SKIP: "1"
      SAMPLE_ATTEMPTS: "3"
      # A hosted runner sometimes boots a guest in more than the 90s that KVM gets by default.
      QEMU_START_TIMEOUT: "180"
      # The first call of the crewai sample imports crewai inside the guest: about 60s with KVM on a fast host.
      PYSANDBOXES_RPC_TIMEOUT: "900"
      PYSANDBOXES_QEMU_TCG: "1"
      QEMU_USE_KVM: "true"
      QEMU_MICROVM_OPTIONAL_PATHS: /etc/ssl,/etc/ca-certificates,/usr/share/ca-certificates
      QEMU_MICROVM_EMPTY_PATHS: /etc/pki
    steps:
    - uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Give the runner user /dev/kvm
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        test -c /dev/kvm
    - name: Install build tools and QEMU
      run: sudo apt-get update && sudo apt-get install -y make build-essential qemu-system-x86 qemu-utils genisoimage 7zip
    - name: Install Python development headers
      run: sudo apt-get install -y python3-dev
    - name: Install uv
      shell: bash
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Install dependencies
      run: uv sync --group test
    - name: Fetch QEMU image and prepare matched direct-boot artifacts
      run: |
        uv run python -m pysandboxes.remote.qemu_fetch_image
        uv run python -c 'from pysandboxes.remote.qemu_image import get_default_image_path; from pysandboxes.remote.qemu_microvm_boot import ensure_microvm_boot_artifacts; ensure_microvm_boot_artifacts(get_default_image_path(), {})'
    - name: Run every sample with qemu-microvm
      run: make sample-tests
    - name: Run representative TCG sample
      if: matrix.python-version == '3.13' && !inputs.exclude-tcg
      env:
        QEMU_USE_KVM: "false"
      run: make sample-tests-vm-tcg
