name: Wiki sync

# Publishes wiki/ to the GitHub wiki. The wiki is a separate git repository,
# whose pages are linked without the .md extension: a link to `page.md` would
# open the raw file.
on:
  push:
    branches: [ "develop" ]
    paths: [ "wiki/**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Clone the wiki
      run: git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" "$RUNNER_TEMP/wiki"

    - name: Copy and rewrite the pages
      env:
        BLOB: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/
      run: |
        rm -f "$RUNNER_TEMP"/wiki/*.md
        cp wiki/*.md "$RUNNER_TEMP/wiki/"
        cd "$RUNNER_TEMP/wiki"
        perl -pi -e 's/\]\(([\w-]+)\.md(?=[#)])/](\1/g; s/\]\(\.\.\//]($ENV{BLOB}/g' *.md

    - name: Push the wiki
      working-directory: ${{ runner.temp }}/wiki
      run: |
        git add -A
        if git diff --cached --quiet; then
          echo "Wiki already up to date"
          exit 0
        fi
        git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
          commit -m "Sync wiki/ from ${{ github.sha }}"
        git push
