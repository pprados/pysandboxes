name: Cross-OS Provider Tests

# Every provider declares the platforms it runs on, in `_PROVIDER_SPECS`
# (pysandboxes/_os_sandbox.py). A macOS or Windows tag is a claim, and this is
# where it is checked: the registry tests, then the provider suites. A provider
# not tagged for the runner gets no row there; one tagged but not installed skips,
# and PYSANDBOXES_FAIL_ON_SKIP turns that skip into a failure.
#
# The whole unit suite is not run here: much of it is POSIX- or Linux-bound by
# nature, and its failures would bury what this job is for. Modules testing a
# Linux-only provider are left out of the collection by tests/conftest.py.
#
# Windows exercises `appcontainer` and `subprocess`; macOS exercises `sandbox-exec` and `subprocess`.
# Both run the guards' own unit tests: they are what the Python layer rests on there.
#
# Called by full-gate.yml, so the nightly proves macOS and Windows too, plus on demand: `gh act` cannot run macOS or
# Windows runners, and `make gh-tests` only replays the push workflows.
# There is no `make` on Windows either, so pytest is called directly.

on:
  workflow_dispatch:
  workflow_call:

jobs:
  providers:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: python -m pip install uv

    - name: Install GNU utilities on macOS
      if: ${{ matrix.os == 'macos-latest' }}
      run: |
        brew install coreutils gnu-sed jq
        echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
        echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"

    - name: Install dependencies
      run: uv sync --group test

    - name: Provider registry
      run: uv run pytest tests/unit_tests/test_provider_platforms.py

    - name: Guard layer
      run: uv run pytest tests/unit_tests/guard

    - name: AppContainer ACL benchmark
      if: ${{ matrix.os == 'windows-latest' && matrix.python-version == '3.13' && !cancelled() }}
      continue-on-error: true
      timeout-minutes: 5
      run: |
        uv run python - <<'PY'
        import ctypes
        import os
        import subprocess
        import tempfile
        import time
        from ctypes import wintypes

        SID = "S-1-15-2-1"
        COUNT = 6
        RX = 0x1200A9


        class TRUSTEE(ctypes.Structure):
            _fields_ = [
                ("pMultipleTrustee", ctypes.c_void_p),
                ("MultipleTrusteeOperation", wintypes.DWORD),
                ("TrusteeForm", wintypes.DWORD),
                ("TrusteeType", wintypes.DWORD),
                ("ptstrName", ctypes.c_void_p),
            ]


        class EXPLICIT_ACCESS(ctypes.Structure):
            _fields_ = [
                ("grfAccessPermissions", wintypes.DWORD),
                ("grfAccessMode", wintypes.DWORD),
                ("grfInheritance", wintypes.DWORD),
                ("Trustee", TRUSTEE),
            ]


        advapi32 = ctypes.WinDLL("advapi32", use_last_error=True)
        kernel32 = ctypes.WinDLL("kernel32", use_last_error=True)
        advapi32.ConvertStringSidToSidW.argtypes = (
            ctypes.c_wchar_p,
            ctypes.POINTER(ctypes.c_void_p),
        )
        advapi32.GetNamedSecurityInfoW.argtypes = (
            (ctypes.c_wchar_p, wintypes.DWORD, wintypes.DWORD)
            + (ctypes.c_void_p,) * 2
            + (
                ctypes.POINTER(ctypes.c_void_p),
                ctypes.c_void_p,
                ctypes.POINTER(ctypes.c_void_p),
            )
        )
        advapi32.GetNamedSecurityInfoW.restype = wintypes.DWORD
        advapi32.SetEntriesInAclW.argtypes = (
            wintypes.ULONG,
            ctypes.POINTER(EXPLICIT_ACCESS),
            ctypes.c_void_p,
            ctypes.POINTER(ctypes.c_void_p),
        )
        advapi32.SetEntriesInAclW.restype = wintypes.DWORD
        advapi32.SetNamedSecurityInfoW.argtypes = (
            ctypes.c_wchar_p,
            wintypes.DWORD,
            wintypes.DWORD,
        ) + (ctypes.c_void_p,) * 4
        advapi32.SetNamedSecurityInfoW.restype = wintypes.DWORD
        kernel32.LocalFree.argtypes = (ctypes.c_void_p,)


        def check(status: int, what: str) -> None:
            if status:
                raise ctypes.WinError(status)


        def native_grant(path: str) -> None:
            psid = ctypes.c_void_p()
            if not advapi32.ConvertStringSidToSidW(SID, ctypes.byref(psid)):
                raise ctypes.WinError(ctypes.get_last_error())
            dacl = ctypes.c_void_p()
            descriptor = ctypes.c_void_p()
            check(
                advapi32.GetNamedSecurityInfoW(
                    path, 1, 4, None, None, ctypes.byref(dacl), None, ctypes.byref(descriptor)
                ),
                "get",
            )
            access = EXPLICIT_ACCESS(RX, 1, 3, TRUSTEE(None, 0, 0, 0, psid.value))
            new_dacl = ctypes.c_void_p()
            check(
                advapi32.SetEntriesInAclW(
                    1, ctypes.byref(access), dacl, ctypes.byref(new_dacl)
                ),
                "entries",
            )
            check(
                advapi32.SetNamedSecurityInfoW(
                    path, 1, 4 | 0x20000000, None, None, new_dacl, None
                ),
                "set",
            )
            for pointer in (psid, descriptor, new_dacl):
                kernel32.LocalFree(pointer)


        PS_ONE = (
            "$acl = Get-Acl -LiteralPath $env:PYSB_PATH; $sid = New-Object System.Security.Principal.SecurityIdentifier '%s'; "
            "$rule = New-Object System.Security.AccessControl.FileSystemAccessRule($sid, 'ReadAndExecute', "
            "'ContainerInherit,ObjectInherit', 'None', 'Allow'); $acl.AddAccessRule($rule); "
            "$acl.GetSecurityDescriptorSddlForm('Access') | Out-Null"
        ) % SID
        PS_ALL = (
            "foreach ($p in ($env:PYSB_PATHS -split '\\|')) { $env:PYSB_PATH = $p; "
            + PS_ONE
            + " }"
        )


        def powershell(script: str, **env: str) -> float:
            start = time.perf_counter()
            done = subprocess.run(
                [
                    "powershell.exe",
                    "-NoLogo",
                    "-NoProfile",
                    "-NonInteractive",
                    "-Command",
                    script,
                ],
                env={**os.environ, **env},
                capture_output=True,
                text=True,
                check=False,
            )
            if done.returncode:
                raise RuntimeError(done.stderr)
            return time.perf_counter() - start


        with tempfile.TemporaryDirectory() as root:
            paths = []
            for index in range(COUNT):
                directory = os.path.join(root, f"d{index}")
                os.mkdir(directory)
                for name in range(50):
                    open(os.path.join(directory, f"f{name}"), "w").close()
                paths.append(directory)
            print(f"powershell -Command 1 : {powershell('1'):.2f}s")
            start = time.perf_counter()
            for path in paths:
                powershell(PS_ONE, PYSB_PATH=path)
            print(f"one powershell per path x{COUNT} : {time.perf_counter() - start:.2f}s")
            print(
                f"one powershell for {COUNT} paths : {powershell(PS_ALL, PYSB_PATHS='|'.join(paths)):.2f}s"
            )
            start = time.perf_counter()
            for path in paths:
                native_grant(path)
            print(f"native x{COUNT} : {time.perf_counter() - start:.3f}s")
            listing = subprocess.run(
                ["icacls.exe", paths[0]], capture_output=True, text=True
            ).stdout
            print(
                "native ACE present:",
                "ALL APPLICATION PACKAGES" in listing,
                "| child inherits:",
                "ALL APPLICATION PACKAGES"
                in subprocess.run(
                    ["icacls.exe", os.path.join(paths[0], "f0")], capture_output=True, text=True
                ).stdout,
            )
        PY

    - name: AppContainer slowness diagnostic
      if: ${{ matrix.os == 'windows-latest' && matrix.python-version == '3.13' && !cancelled() }}
      continue-on-error: true
      timeout-minutes: 10
      run: |
        uv run python - <<'PY'
        import os, subprocess, sys, time
        for label, root in (("base_prefix", sys.base_prefix), ("venv", sys.prefix)):
            start = time.time()
            files = sum(len(names) for _, _, names in os.walk(root))
            print(f"{label} {root}: {files} files, walked in {time.time() - start:.1f}s", flush=True)
            start = time.time()
            try:
                done = subprocess.run(["icacls.exe", root, "/T"], capture_output=True, text=True, timeout=240)
                print(f"{label}: icacls /T rc={done.returncode} in {time.time() - start:.1f}s", flush=True)
            except subprocess.TimeoutExpired:
                print(f"{label}: icacls /T still running after 240s", flush=True)
        test = "tests/integration_tests/test_guards_with_providers.py::test_eval_is_refused_under_every_backend"
        child = subprocess.Popen([sys.executable, "-m", "pytest", "-x", "-s", "-k", "appcontainer", test])
        started = time.time()
        for mark in (45, 120):
            time.sleep(max(0, mark - (time.time() - started)))
            print(f"--- processes at {mark}s (pytest exit: {child.poll()})", flush=True)
            subprocess.run(["powershell", "-NoProfile", "-Command",
                "Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'python|icacls|powershell|cmd' } | "
                "Select-Object ProcessId,ParentProcessId,Name,CreationDate,CommandLine | Format-List"])
        child.kill()
        print(f"pytest ended after {time.time() - started:.0f}s", flush=True)
        trace = os.path.join(os.environ["LOCALAPPDATA"], "pysandboxes", "appcontainer", "acl-trace.log")
        print("--- acl-trace.log", flush=True)
        print(open(trace, encoding="utf-8").read() if os.path.exists(trace) else "(no trace file)", flush=True)
        PY

    - name: Provider suites
      if: ${{ !cancelled() }}  # runs even when the guard layer failed: both results are wanted
      timeout-minutes: 20
      env:
        PYSANDBOXES_FAIL_ON_SKIP: "1"
      run: >-
        uv run pytest -rs -x --tb=short --durations=10 -m 'not slow'
        tests/integration_tests/test_guards_with_providers.py
        tests/integration_tests/test_usage_with_providers.py

    - name: macOS Seatbelt enforcement
      if: ${{ matrix.os == 'macos-latest' && !cancelled() }}
      env:
        PYSANDBOXES_FAIL_ON_SKIP: "1"
      run: >-
        uv run pytest -rs
        tests/integration_tests/remote/test_sandbox_exec.py
        tests/integration_tests/test_os_file_confinement.py
        tests/integration_tests/test_os_netfilter.py

    - name: AppContainer integration
      if: ${{ matrix.os == 'windows-latest' && !cancelled() }}
      timeout-minutes: 15
      env:
        PYSANDBOXES_FAIL_ON_SKIP: "1"
      run: >-
        uv run pytest -rs -x --tb=short --durations=10
        tests/unit_tests/remote/test_appcontainer_acl_native.py
        tests/integration_tests/remote/test_appcontainer.py
        tests/integration_tests/test_temp_cleanup.py
