#
# Builds the five container images of a signed release tag and pushes them to Docker Hub, one runner per Python, each
# FROM the newest patch of its Python. Called by release.yml with the wheel it built and checked against the index;
# dispatched on a final tag by images-refresh.yml when python:<minor>-slim moves to a new patch, it then rebuilds the
# wheel at the tag (the build is reproducible) and checks it against the index, so the images always embed exactly
# what was published. The push credential lives in the dockerhub environment, restricted to v* tags: a dispatch on
# any other ref gets no credential.
name: Images

on:
  workflow_call:
    inputs:
      wheel-artifact:
        description: Artifact of the calling run holding the wheel already checked against the index
        type: string
        required: true
  workflow_dispatch:
    inputs:
      python-versions:
        description: JSON list of the Python minors to rebuild
        type: string
        default: '["3.11", "3.12", "3.13", "3.14"]'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.tag.outputs.version }}
      final: ${{ steps.tag.outputs.final }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    # actions/checkout replaces the annotated tag with a lightweight one, which drops the signature.
    - name: Fetch the annotated tag
      run: git fetch --force origin "refs/tags/${GITHUB_REF#refs/tags/}:refs/tags/${GITHUB_REF#refs/tags/}"

    - name: Check the tag name, signature and ancestry
      id: tag
      env:
        ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}
      run: .github/scripts/verify-release-tag.sh "$GITHUB_REF" >>"$GITHUB_OUTPUT"

  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dockerhub
    # One runner per Python: the qemu image alone holds a guest disk, five images times four would not fit on one.
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions || '["3.11", "3.12", "3.13", "3.14"]') }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      IMAGE_PYTHON: ${{ matrix.python-version }}
      DEFAULT_PYTHON: "3.14"
      UV_PYTHON: "3.13"
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y make build-essential

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: "3.13"

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/0.11.16/install.sh | sh

    - name: Install dependencies
      run: uv sync --locked

    # Before the build, so the base image pulls are authenticated and escape the anonymous rate limit.
    - name: Log in to Docker Hub
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

    # Resolved before the build, which then starts FROM python:<patch>-slim: the tags name the patch really held.
    - name: Resolve the Python patch
      run: |
        patch=$(.github/scripts/python-patch.sh "$IMAGE_PYTHON")
        echo "PATCH=$patch" >>"$GITHUB_ENV"

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      if: inputs.wheel-artifact != ''
      with:
        name: ${{ inputs.wheel-artifact }}
        path: dist/

    - name: Rebuild the wheel at the tag and check it against the index
      if: inputs.wheel-artifact == ''
      env:
        INDEX_URL: >-
          ${{ needs.verify.outputs.final == 'true' && 'https://pypi.org/simple/'
          || 'https://test.pypi.org/simple/' }}
        ATTEMPTS: "1"
      run: |
        uv build --wheel
        .github/scripts/verify-published.sh "$VERSION" dist/pysandboxes-"$VERSION"-*.whl

    # A fresh checkout's mtimes would make .make-dist rerun uv build, which deletes the wheel.
    - name: Build the five images from the published wheel
      run: |
        touch .make-dist
        make -o uv.lock CONTAINER_CMDS=docker PYTHON_VERSION="$PATCH" build-images

    - name: Smoke-test the images
      run: .github/scripts/smoke-test-images.sh "$VERSION" "$PATCH"

    - name: Push the tags
      run: |
        mapfile -t tags < <(.github/scripts/image-tags.sh "$VERSION" "$PATCH" "$DEFAULT_PYTHON")
        for image in python-sb python-sb-landlock python-sb-unshare python-sb-bwrap python-sb-qemu; do
          for tag in "${tags[@]}"; do
            target="docker.io/pprados/$image:$tag"
            docker tag "$image:$PATCH" "$target"
            docker push "$target"
          done
          echo "- \`$(docker inspect --format '{{index .RepoDigests 0}}' "$target")\`" >>"$GITHUB_STEP_SUMMARY"
        done
