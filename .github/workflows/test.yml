name: Python Tests

on:
  push:
    branches: [ "**" ]
    paths-ignore: [ "**.md", "wiki/**" ]
  pull_request:
    branches: [ "**" ]
    paths-ignore: [ "**.md", "wiki/**" ]

# Unit tests, plus a small provider smoke subset of the integration suite (see the
# provider-smoke job below). The rest of integration-tests, container-tests and sample-tests
# are not run here: they need a VM, minikube-built images or the samples' own API keys.
# See integration.yml for the full integration suite.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11","3.12","3.13","3.14","3.15"]

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y make build-essential

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python development headers
      run: sudo apt-get install -y python3-dev

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        version: "0.11.16"

    - name: Check installation of uv
      run: test "$(uv --version | cut -d' ' -f2)" = "0.11.16"

    - name: Install dependencies
      run: uv sync --group test

    - name: Run unit tests
      run: make unit-tests

  provider-smoke:
    runs-on: ubuntu-latest
    # subprocess, landlock, bwrap and unshare: the Linux providers that launch a real sandboxed child
    # with no VM, no container and nothing beyond bwrap's/unshare's own needs. The unit tier above never
    # launches one, so a regression like commit 02723db7 -- which broke every `-m` launch under every OS
    # provider -- reached `develop` before the nightly tests/integration_tests/test_usage_with_providers.py
    # run (.github/workflows/integration.yml) caught it. firejail, qemu, gvisor and smolvm still run only
    # there, or in cross-os.yml for macOS/Windows: they need a VM, extra packages, or a kernel feature this
    # fast job does not install.
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y make build-essential

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.14"

    - name: Install Python development headers
      run: sudo apt-get install -y python3-dev

    # bwrap and unshare need their own namespaces; Ubuntu 24.04 restricts unprivileged user namespaces
    # through AppArmor by default (see wiki/unshare.md). A container, as under `act`, cannot change that
    # sysctl: the two rows then skip or fail there, not on a hosted runner.
    - name: Install the provider binaries
      run: |
        sudo apt-get install -y bubblewrap slirp4netns iptables iproute2
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        version: "0.11.16"

    - name: Check installation of uv
      run: test "$(uv --version | cut -d' ' -f2)" = "0.11.16"

    - name: Install dependencies
      run: uv sync --group test

    - name: Run the provider smoke tests
      run: make provider-smoke-tests
