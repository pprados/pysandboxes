name: Python Tests

on:
  push:
    branches: [ "**" ]
    paths-ignore: [ "**.md", "wiki/**" ]
  pull_request:
    branches: [ "**" ]
    paths-ignore: [ "**.md", "wiki/**" ]

# Unit tests only. integration-tests, container-tests and sample-tests are
# not run here: they need an OS provider, minikube-built images and the
# samples' own API keys. See integration.yml for the integration suite.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11","3.12","3.13","3.14"]

    steps:
    - uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y make build-essential

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python development headers
      run: sudo apt-get install -y python3-dev

    - name: Install uv
      shell: bash
      run: |
        UV_VERSION="0.8.17"
        UV_BIN_DIR="$RUNNER_TEMP/uv_bin"
        mkdir -p "$UV_BIN_DIR"

        # Download binary Linux/x86_64
        curl -LsSf https://astral.sh/uv/install.sh | sh -s --

        echo "$UV_BIN_DIR" >> $GITHUB_PATH

    - name: Check installation of uv
      run: uv --version

    - name: Install dependencies
      run: uv sync --group test

    - name: Run unit tests
      run: make unit-tests
