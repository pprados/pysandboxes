name: Container Tests

# Runs the docker, podman and kubernetes suites. Called by full-gate.yml (nightly on develop, and for a release tag
# whose commit no nightly proved), plus on demand. They build eight provider images and start a minikube cluster, so
# they are not tied to every push. They have no TCG row: nested QEMU needs the host's /dev/kvm, which a step opens.
#
# One runner per suite: each builds its images with the one engine it tests
# (CONTAINER_CMDS), so no runner holds two copies of the eight images -- with both,
# plus the copy loaded into minikube, /var reached 99% and minikube refused to start.
# The suites also run in parallel and report apart.
#
# A hosted runner has /dev/kvm, but root:kvm 0660 without the runner user in the
# group: docker reaches it through its root daemon, rootless podman does not and
# falls back to TCG, too slow for the container timeout. A step opens it.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          # smolvm is left out of every suite: a hosted runner refuses the virtio-fs shares of its guest.
          # It is run locally before a release (wiki/release.md).
          - suite: docker
            engine: docker
            tests: test_container_runtime and docker and not smolvm
          - suite: podman
            engine: podman
            tests: test_container_runtime and podman and not smolvm
          - suite: kubernetes
            engine: docker
            tests: test_container_kubernetes and not smolvm
    name: containers (${{ matrix.suite }})

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # Margin for the images and minikube's copy of them: the runner starts at
    # 83% with one engine per job, and minikube refuses to start near 99%.
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h /

    # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, on the host and so in a container:
    # gVisor, which starts in `unshare --user`, needs them even in a container with reduced privileges.
    - name: Allow unprivileged user namespaces
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
    - name: Give the runner user /dev/kvm
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        ls -l /dev/kvm

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y make build-essential

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: "3.13"

    - name: Install Python development headers
      run: sudo apt-get install -y python3-dev

    - name: Install podman
      if: matrix.engine == 'podman'
      run: sudo apt-get install -y podman

    # test_containers.py invokes `kubectl` as a command, not `minikube kubectl`,
    # so it needs its own binary. Both downloads follow the vendors' documented
    # "latest stable" URLs rather than a pinned release.
    - name: Install minikube and kubectl
      if: matrix.suite == 'kubernetes'
      run: |
        curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        sudo install minikube-linux-amd64 /usr/local/bin/minikube
        rm minikube-linux-amd64

        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        sudo install kubectl /usr/local/bin/kubectl
        rm kubectl

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        version: "0.11.16"

    - name: Check installation of uv
      run: test "$(uv --version)" = "uv 0.11.16"

    - name: Install dependencies
      run: uv sync --group test

    # container-tests depends on build-images, which depends on .make-dist, so
    # make builds the wheel and the eight provider images on its own, with this
    # job's engine only. Where minikube is installed, it then starts it and loads
    # the images into it.
    - name: Run container tests
      env:
        CONTAINER_CMDS: ${{ matrix.engine }}
        # Only a timeout is run again, twice at most: an assertion that fails is never rerun.
        PYTEST_ADDOPTS: >-
          -k "${{ matrix.tests }}"
          --reruns 2 --only-rerun "Daemon failed to start|did not respond within|did not answer within|TimeoutError|timed out"
      run: |
        df -h /
        make container-tests
