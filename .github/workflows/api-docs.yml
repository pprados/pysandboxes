name: API Documentation

# Publishes the API reference from develop, the integration branch, so the pages
# follow the API as it is being built. workflow_dispatch republishes on demand.
on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time, and never cancel one midway: a cancelled deploy
# leaves the site on its previous version, not half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y make build-essential

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install Python development headers
      run: sudo apt-get install -y python3-dev

    - name: Install uv
      shell: bash
      run: |
        UV_VERSION="0.8.17"
        UV_BIN_DIR="$RUNNER_TEMP/uv_bin"
        mkdir -p "$UV_BIN_DIR"

        # Download binary Linux/x86_64
        curl -LsSf https://astral.sh/uv/install.sh | sh -s --

        echo "$UV_BIN_DIR" >> $GITHUB_PATH

    - name: Check installation of uv
      run: uv --version

    - name: Install dependencies
      run: uv sync

    # pdoc imports the package, so the dependencies must be installed first.
    - name: Build the API documentation
      run: make api_docs_build

    # Reports dead links without gating the publication: a broken link is worth
    # knowing about, not worth blocking a release deploy over. Read the step log
    # to see what it found. The target checks internal links only -- add
    # --check-extern in the Makefile to also follow third-party URLs, which
    # would make this step depend on their availability.
    - name: Check the documentation links
      run: make api_docs_linkcheck
      continue-on-error: true

    - uses: actions/configure-pages@v5

    - uses: actions/upload-pages-artifact@v3
      with:
        path: docs/api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
