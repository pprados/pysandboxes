name: API Documentation

# Publishes the API reference from develop, the integration branch, so the pages
# follow the API as it is being built. workflow_dispatch republishes on demand.
on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time, and never cancel one midway: a cancelled deploy
# leaves the site on its previous version, not half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # GitHub Pages is not enabled while the repository is private; the job, and the
    # deploy that needs it, turn themselves on when it goes public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y make build-essential

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: "3.13"

    - name: Install Python development headers
      run: sudo apt-get install -y python3-dev

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        version: "0.11.16"

    - name: Check installation of uv
      run: test "$(uv --version)" = "uv 0.11.16"

    - name: Install dependencies
      run: uv sync

    # pdoc imports the package, so the dependencies must be installed first.
    - name: Build the API documentation
      run: make api_docs_build

    # Reports dead links without gating the publication: a broken link is worth
    # knowing about, not worth blocking a release deploy over. Read the step log
    # to see what it found. The target checks internal links only -- add
    # --check-extern in the Makefile to also follow third-party URLs, which
    # would make this step depend on their availability.
    - name: Check the documentation links
      run: make api_docs_linkcheck
      continue-on-error: true

    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6

    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
      with:
        path: docs/api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
