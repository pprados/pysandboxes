name: Python Integration Tests

# Called by full-gate.yml (nightly on develop, and for a release tag whose commit no nightly proved), plus on
# demand. These tests launch real sandboxed child processes, so they are slower and less hermetic than the unit
# suite, and the provider matrix in tests/integration_tests/test_usage_with_providers.py boots a VM. A hosted
# runner exposes /dev/kvm once a udev rule opens it to the runner user: the `qemu` rows then run accelerated, and
# the `qemu-tcg` rows cover emulation. Every integration test must run here: a skipped test -- a provider missing,
# a network the runner lacks -- fails the run, but only at the end, so the report still shows what passes and what
# does not (see tests/integration_tests/conftest.py).
#
# `exclude-tcg` deselects the `qemu-tcg` rows (`-m "not slow"`, the marker only they carry) and makes a missing
# /dev/kvm fail the run instead of letting the `qemu` rows emulate. The release sets it: those rows cost about 40 of
# the 46 minutes of a row, and the nightly runs them anyway.
#
# The nightly run validates the integration branch, `develop`: GitHub only honours `schedule:` on the default
# branch, and full-gate.yml, which holds the schedule, skips a night without a commit.
#
# container-tests and sample-tests are deliberately absent: containers.yml and samples.yml hold them.
on:
  workflow_dispatch:
    inputs:
      exclude-tcg:
        description: Leave the qemu-tcg rows out and require /dev/kvm
        type: boolean
        default: false
  workflow_call:
    inputs:
      exclude-tcg:
        type: boolean
        default: false

# One run per branch at a time: a second dispatch waits for the running one instead
# of booting the same VMs twice, and a third replaces the waiting one. A run is
# never cancelled midway, since restarting 45 minutes of tests teaches nothing new.
# Called by full-gate.yml, github.workflow is the caller's name: a dispatch never
# replaces a waiting nightly, whose run the release could reuse.
concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11","3.12","3.13","3.14"]
    # A uv-managed interpreter, not actions/setup-python: the qemu guest runs the host's
    # interpreter over 9p against the image's glibc (2.37), and the runner's own 3.11
    # build needs glibc 2.38, so the guest could not even start it. uv's builds target
    # an older glibc.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_PREFERENCE: only-managed

    steps:
    - uses: actions/checkout@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y make build-essential

    - name: Install Python development headers
      run: sudo apt-get install -y python3-dev

    # Without their binaries the provider rows skip themselves, and the run says
    # nothing about bwrap, firejail, unshare or qemu. Ubuntu 24.04 also restricts
    # unprivileged user namespaces through AppArmor, which bwrap and unshare need
    # (see wiki/unshare.md). A container, as under `act`, cannot change that
    # sysctl: the rows that need it then skip or fail there, not on the runner.
    - name: Install the OS providers
      run: |
        sudo apt-get install -y bubblewrap firejail slirp4netns iptables iproute2 \
          qemu-system-x86 qemu-utils genisoimage
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

    - name: Prepare Firejail network-filter test
      run: |
        sudo ip link add br-pysb-test type bridge
        sudo ip addr add 198.18.0.1/24 dev br-pysb-test
        sudo ip link set br-pysb-test up
        sudo sed -i -E '/^[[:space:]]*restricted-network[[:space:]]+/d' /etc/firejail/firejail.config
        echo 'restricted-network no' | sudo tee -a /etc/firejail/firejail.config

    # The rule GitHub documents for hardware-accelerated emulators. Where /dev/kvm is
    # absent, as in a container under `act`, qemu falls back to emulation by itself,
    # unless exclude-tcg asks for KVM.
    - name: Enable KVM
      env:
        EXCLUDE_TCG: ${{ inputs.exclude-tcg }}
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm || true
        if [ -e /dev/kvm ]; then
          ls -l /dev/kvm
        elif [ "$EXCLUDE_TCG" = true ]; then
          echo "::error::no /dev/kvm: with exclude-tcg the qemu rows must not emulate"
          exit 1
        else
          echo "no /dev/kvm: qemu rows will emulate"
        fi

    - name: Install uv
      shell: bash
      run: |
        UV_VERSION="0.8.17"
        UV_BIN_DIR="$RUNNER_TEMP/uv_bin"
        mkdir -p "$UV_BIN_DIR"

        # Download binary Linux/x86_64
        curl -LsSf https://astral.sh/uv/install.sh | sh -s --

        echo "$UV_BIN_DIR" >> $GITHUB_PATH

    - name: Check installation of uv
      run: uv --version

    - name: Install dependencies
      run: uv sync --group test

    # The first qemu row would otherwise download the 665 MiB guest image inside its
    # own daemon start timeout, and fail for a slow network rather than for a bug.
    # Dockerfile-qemu fetches it at build time for the same reason.
    - name: Fetch the QEMU guest image
      run: uv run python -m pysandboxes.remote.qemu_fetch_image

    - name: Run integration tests
      env:
        PYSANDBOXES_FAIL_ON_SKIP: "1"
        PYSANDBOXES_FIREJAIL_TEST_BRIDGE: br-pysb-test
        PYTEST_ADDOPTS: --durations=20 ${{ inputs.exclude-tcg && '-m "not slow"' || '' }}
      run: make integration-tests

    - name: Remove Firejail test bridge
      if: always()
      run: sudo ip link delete br-pysb-test || true
