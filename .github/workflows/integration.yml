name: Python Integration Tests

# Nightly, plus on demand. These tests launch real sandboxed child processes, so
# they are slower and less hermetic than the unit suite, and the provider matrix
# in tests/integration_tests/test_usage_with_providers.py boots a VM. A hosted
# runner exposes no /dev/kvm, so those rows run under TCG emulation, which
# containers.yml already relies on. Providers whose binary is missing skip
# themselves cleanly (see provider_skip_reason), so the run stays green on a
# runner that lacks one.
#
# The nightly run validates the integration branch, `develop`. GitHub only honours
# `schedule:` on the default branch, which is `develop`, so the schedule already
# fires from the branch under test; the pinning step below states that contract in
# the tree rather than leaving it to a repository setting no file records. A night
# without a commit on `develop` is skipped by the `changes` job -- re-running the
# same tree teaches nothing.
#
# container-tests and sample-tests are deliberately absent: the first needs
# minikube plus locally built images, the second has its own nightly workflow,
# samples.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  # A cheap guard job rather than a step: it keeps the whole setup -- apt, uv,
  # the dependency install -- out of a night that has nothing new to test.
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commits.outputs.changed }}

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        # `git rev-list --since` needs the history the default shallow clone omits.
        fetch-depth: 0

    - name: Move to the integration branch
      if: github.event_name == 'schedule'
      run: git checkout -B develop origin/develop

    - name: Look for commits from the last day
      id: commits
      run: |
        count=$(git rev-list --count --since='24 hours ago' HEAD)
        echo "$count commit(s) in the last 24 hours"
        if [ "$count" -gt 0 ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

  integration:
    needs: changes
    # Only the nightly run is skippable: a manual dispatch, and a local `act` run,
    # always execute the suite.
    if: github.event_name != 'schedule' || needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # The branch under test is `develop`, not the branch the schedule fired from.
    # Done here rather than through `actions/checkout`'s `ref:` input: `act` only
    # substitutes its bind of the working directory when that input is absent, and
    # the real action it otherwise runs wants credentials a local run has no reason
    # to hold. Keeping `with:` free of `ref` is what keeps `make gh-tests` working.
    - name: Move to the integration branch
      if: github.event_name == 'schedule'
      run: |
        git fetch --depth=1 origin develop
        git checkout -B develop FETCH_HEAD

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y make build-essential

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python development headers
      run: sudo apt-get install -y python3-dev

    # Without their binaries the provider rows skip themselves, and the run says
    # nothing about bwrap, firejail, unshare or qemu. Ubuntu 24.04 also restricts
    # unprivileged user namespaces through AppArmor, which bwrap and unshare need
    # (see wiki/unshare.md). A container, as under `act`, cannot change that
    # sysctl: the rows that need it then skip or fail there, not on the runner.
    - name: Install the OS providers
      run: |
        sudo apt-get install -y bubblewrap firejail slirp4netns iptables iproute2 \
          qemu-system-x86 qemu-utils genisoimage
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

    - name: Install uv
      shell: bash
      run: |
        UV_VERSION="0.8.17"
        UV_BIN_DIR="$RUNNER_TEMP/uv_bin"
        mkdir -p "$UV_BIN_DIR"

        # Download binary Linux/x86_64
        curl -LsSf https://astral.sh/uv/install.sh | sh -s --

        echo "$UV_BIN_DIR" >> $GITHUB_PATH

    - name: Check installation of uv
      run: uv --version

    - name: Install dependencies
      run: uv sync --group test

    # The first qemu row would otherwise download the 665 MiB guest image inside its
    # own daemon start timeout, and fail for a slow network rather than for a bug.
    # Dockerfile-qemu fetches it at build time for the same reason.
    - name: Fetch the QEMU guest image
      run: uv run python -m pysandboxes.remote.qemu_fetch_image

    - name: Run integration tests
      # The `qemu-tcg` rows -- the only ones marked `slow` -- are dropped here. They
      # exist to cover emulation on a developer machine that has /dev/kvm; a hosted
      # runner has none, so qemu already emulates and the extra row boots a second,
      # identical VM per test for no added coverage (see _env.py:24-30).
      env:
        PYTEST_ADDOPTS: -m 'not slow'
      run: make integration-tests
