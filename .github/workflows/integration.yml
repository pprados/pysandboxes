name: Python Integration Tests

# Manual only. These tests launch real sandboxed child processes, so they are
# slower and less hermetic than the unit suite, and the provider matrix in
# tests/integration_tests/test_usage_with_providers.py currently targets qemu,
# which a hosted runner cannot boot. Providers whose binary is missing skip
# themselves cleanly (see _skip_reason), so the run stays green on a bare
# runner. Add a `schedule:` block here to also run it nightly.
#
# container-tests and sample-tests are deliberately absent: the first needs
# minikube plus locally built images, the second needs the samples' API keys.
on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y make build-essential

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python development headers
      run: sudo apt-get install -y python3-dev

    - name: Install uv
      shell: bash
      run: |
        UV_VERSION="0.8.17"
        UV_BIN_DIR="$RUNNER_TEMP/uv_bin"
        mkdir -p "$UV_BIN_DIR"

        # Download binary Linux/x86_64
        curl -LsSf https://astral.sh/uv/install.sh | sh -s --

        echo "$UV_BIN_DIR" >> $GITHUB_PATH

    - name: Check installation of uv
      run: uv --version

    - name: Install dependencies
      run: uv sync --group test

    - name: Run integration tests
      run: make integration-tests
