#
# The full test gate: the integration suite (3.11-3.14), the samples (3.11-3.14) and the container suites.
# Nightly on develop, TCG included; called by release.yml, TCG left out, for a tag whose commit no nightly proved.
# .github/scripts/find-nightly-gate.sh reuses a nightly by reading the names of these jobs: keep the ids
# integration, samples and containers.
name: Full Gate

on:
  schedule:
    # 20:17 UTC (22:17 in Paris in summer): done before the working day even when GitHub fires a schedule hours
    # late, as it did by 5h30 on 2026-09-30; off the hour, when scheduled runs pile up.
    - cron: "17 20 * * *"
    # TEMPORARY, until v0.1.0b4 proves the reuse path: two runs today, since GitHub may drop a schedule. Remove after.
    - cron: "53 9 * * *"
    - cron: "23 10 * * *"
  workflow_dispatch:
    inputs:
      exclude-tcg:
        description: Leave the qemu-tcg rows out and require /dev/kvm
        type: boolean
        default: false
  workflow_call:
    inputs:
      exclude-tcg:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # A cheap guard job: a night without a commit on develop re-runs nothing. A call or a dispatch always runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commits.outputs.changed }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    # GitHub fires schedule: from the default branch, a repository setting: assert it is develop rather than
    # re-fetch it, which could test a later commit than the run's headSha, the one the reuse lookup trusts. A failed
    # guard skips the suites, and such a nightly is never reused.
    - name: Check that the nightly tests develop
      if: github.event_name == 'schedule'
      run: |
        if [ "$GITHUB_REF" != refs/heads/develop ]; then
          echo "::error::the nightly runs on $GITHUB_REF, not refs/heads/develop"
          exit 1
        fi

    # Under schedule, the checkout is github.sha, the head of develop: the commit the suites test.
    - name: Look for commits from the last day
      id: commits
      run: |
        count=$(git rev-list --count --since='24 hours ago' HEAD)
        echo "$count commit(s) in the last 24 hours"
        if [ "$count" -gt 0 ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

  # Under schedule, inputs.exclude-tcg is null, and null == true is false: the nightly keeps TCG.
  integration:
    needs: changes
    if: github.event_name != 'schedule' || needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/integration.yml
    with:
      exclude-tcg: ${{ inputs.exclude-tcg == true }}

  samples:
    needs: changes
    if: github.event_name != 'schedule' || needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/samples.yml

  containers:
    needs: changes
    if: github.event_name != 'schedule' || needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/containers.yml
