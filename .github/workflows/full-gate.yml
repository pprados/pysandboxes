# The full test gate: the integration suite (3.11-3.14), the samples (3.11-3.14), the container suites and the
# macOS and Windows provider suites (3.11-3.14).
# Nightly on develop, TCG included, started by nightly-trigger.yml; called by release.yml, TCG left out, for a tag
# whose commit no nightly proved.
# .github/scripts/find-nightly-gate.sh reuses a nightly by reading the names of these jobs: keep the ids
# integration, samples, containers and cross-os, and the run name Nightly.
name: Full Gate

# Titled Nightly only for the full nightly: the reuse lookup trusts that title.
run-name: ${{ inputs.nightly == true && inputs.exclude-tcg != true && 'Nightly' || 'Full Gate' }}

on:
  workflow_dispatch:
    inputs:
      exclude-tcg:
        description: Leave the qemu-tcg rows out and require /dev/kvm
        type: boolean
        default: false
      nightly:
        description: Behave as the nightly, which nightly-trigger.yml starts on develop
        type: boolean
        default: false
  workflow_call:
    inputs:
      exclude-tcg:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # A cheap guard job: a night without a commit on develop re-runs nothing. A call or a dispatch always runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commits.outputs.changed }}
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        fetch-depth: 0

    # Assert the ref is develop rather than re-fetch it, which could test a later commit than the run's headSha, the
    # one the reuse lookup trusts. A failed guard skips the suites, and such a nightly is never reused.
    - name: Check that the nightly tests develop
      if: inputs.nightly == true
      run: |
        if [ "$GITHUB_REF" != refs/heads/develop ]; then
          echo "::error::the nightly runs on $GITHUB_REF, not refs/heads/develop"
          exit 1
        fi

    # The checkout is github.sha, the head of the ref dispatched: the commit the suites test.
    - name: Look for commits from the last day
      id: commits
      run: |
        count=$(git rev-list --count --since='24 hours ago' HEAD)
        echo "$count commit(s) in the last 24 hours"
        if [ "$count" -gt 0 ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

  # The nightly leaves exclude-tcg at false: it keeps TCG.
  integration:
    needs: changes
    if: inputs.nightly != true || needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/integration.yml
    with:
      exclude-tcg: ${{ inputs.exclude-tcg == true }}

  samples:
    needs: changes
    if: inputs.nightly != true || needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/samples.yml

  containers:
    needs: changes
    if: inputs.nightly != true || needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/containers.yml

  cross-os:
    needs: changes
    if: inputs.nightly != true || needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/cross-os.yml
