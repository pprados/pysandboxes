apiVersion: v1
kind: Pod
metadata:
  name: pysandboxes-test
spec:
  containers:
    - name: pysandboxes-test
      image: python:latest
      workingDir: /app
      command: [ "/bin/sh", "-c","sleep infinity" ] # Garde le pod en vie
#      command: [ "/bin/sh", "-c" ] # Garde le pod en vie
#      args:
#        - |
#          apt update && \
#          apt install -y libvirt-dev pkg-config iptables iproute2 slirp4netns && \
#          pip install -e . && \
#          OS_SANDBOX=unshare python-sb -m tests.integration_tests.tst_usage
      volumeMounts:
        - name: code-local
          mountPath: /app  # Chemin à l'intérieur du Pod
  volumes:
    - name: code-local
      hostPath:
        path: /mnt/pysandboxes
        type: Directory